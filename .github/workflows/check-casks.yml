name: Check Casks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Homebrew's style and audit rules change independently of this repository.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_casks:
    name: Check Casks
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      ISSUE_TITLE: Scheduled Cask checks are failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch all history to be able to diff against base branch
          fetch-depth: 0

      - name: Tap the local repository
        run: brew tap "tmatilai/terraforms" "$(pwd)"

      - name: Check style
        run: brew style Casks Formula

      - name: Audit Casks and formulae
        run: brew audit --tap=tmatilai/terraforms

      - name: Get formulae to test
        id: formulae
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Testing installs the formula, so on a pull request only test the
          # changed ones. Scheduled runs test them all.
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'Formula/*.rb')
          else
            files=$(printf '%s\n' Formula/*.rb)
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test formulae
        if: ${{ steps.formulae.outputs.files }}
        env:
          FILES: ${{ steps.formulae.outputs.files }}
        run: |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            name="tmatilai/terraforms/$(basename "$path" .rb)"
            brew install --formula "$name"
            # `brew test` refuses to run unless test dependencies are installed.
            brew install --only-dependencies --include-test --formula "$name"
            brew test "$name"
          done <<< "$FILES"

      - name: Find an open failure issue
        id: issue
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report a scheduled failure
        if: ${{ failure() && github.event_name == 'schedule' && !steps.issue.outputs.number }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "$ISSUE_TITLE" --body "Failed run: $RUN_URL"

      - name: Close the failure issue
        if: ${{ success() && steps.issue.outputs.number }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue close "$NUMBER" --comment "Passing again: $RUN_URL"
