name: Add New Terraform Casks
on:
  schedule:
    # Daily at 04:20 UTC
    - cron:  '20 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency: add-new-casks

jobs:
  add_new_casks:
    name: Add New Terraform Casks
    # Only run on the main repo
    if: github.repository == 'tmatilai/homebrew-terraforms'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find and add new Casks
        id: casks
        run: |
          set -euo pipefail
          ./scripts/add_new_terraform_casks > "$RUNNER_TEMP/new.tsv"
          {
            echo '**Versions:**'
            echo
            while IFS=$'\t' read -r version _; do
              echo "Adding v$version" >&2
              printf '* [v%s](https://github.com/hashicorp/terraform/releases/tag/v%s)\n' "$version" "$version"
            done < "$RUNNER_TEMP/new.tsv"
            printf '\nGenerated by "%s" GitHub Action\n' "$GITHUB_WORKFLOW"
          } > "$RUNNER_TEMP/body.md"
          echo "added=$(wc -l < "$RUNNER_TEMP/new.tsv" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Create or update the pull request
        if: steps.casks.outputs.added != '0'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH: new-terraform-versions
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force origin "${GITHUB_SHA}:refs/heads/${BRANCH}"

          # The ruleset requires signed commits, so commit through the API
          head=$GITHUB_SHA
          while IFS=$'\t' read -r version path; do
            head=$(./scripts/create_commit "$BRANCH" "$head" "Add Terraform v$version" "$path")
          done < "$RUNNER_TEMP/new.tsv"

          pr=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          else
            pr=$(gh pr create --head "$BRANCH" --title "Add new Terraform versions" --body-file "$RUNNER_TEMP/body.md")
          fi
          gh pr merge "$pr" --auto --squash
