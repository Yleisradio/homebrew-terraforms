name: Check Casks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Homebrew's style and audit rules change independently of this repository.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_casks:
    name: Check Casks
    runs-on: macos-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch all history to be able to diff against base branch
          fetch-depth: 0

      - name: Tap the local repository
        run: brew tap "tmatilai/terraforms" "$(pwd)"

      - name: Check style
        run: brew style Casks Formula

      - name: Audit Casks
        run: brew audit --tap=tmatilai/terraforms

      - name: Audit formulae
        run: |
          # `--tap` does not cover formulae, so audit them by name.
          for f in Formula/*.rb; do
            brew audit --formula "tmatilai/terraforms/$(basename "$f" .rb)"
          done

      - name: Get formulae to test
        id: formulae
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Testing installs the formula, so on a pull request only test the
          # changed ones. Scheduled runs test them all.
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'Formula/*.rb')
          else
            files=$(printf '%s\n' Formula/*.rb)
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Test formulae
        if: ${{ steps.formulae.outputs.files }}
        env:
          FILES: ${{ steps.formulae.outputs.files }}
        run: |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            name="tmatilai/terraforms/$(basename "$path" .rb)"
            brew install --formula "$name"
            # `brew test` refuses to run unless test dependencies are installed.
            brew install --only-dependencies --include-test --formula "$name"
            brew test "$name"
          done <<< "$FILES"

      - name: Report a scheduled failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Scheduled Cask checks are failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            echo "An issue is already open."
            exit 0
          fi
          gh issue create --title "$TITLE" \
            --body "\`brew style\` or \`brew audit\` failed: $RUN_URL"
