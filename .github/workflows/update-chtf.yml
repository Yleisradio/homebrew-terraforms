name: Update chtf

on:
  # Sent by the release workflow in tmatilai/chtf
  repository_dispatch:
    types: [chtf-release]
  workflow_dispatch:
    inputs:
      version:
        description: "chtf version to update to, defaults to the latest release"
        required: false
  # Fallback for a missed dispatch. Daily at 23:40 UTC
  schedule:
    - cron: '40 23 * * *'

permissions:
  contents: read

jobs:
  update_chtf:
    name: Update chtf
    # Only run on the main repo
    if: github.repository == 'tmatilai/homebrew-terraforms'
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version to update to
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # Not interpolated into the script, as they are external input
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$DISPATCH_VERSION}"
          if [ -z "$version" ]; then
            version=$(gh release view --repo tmatilai/chtf --json tagName --jq '.tagName')
          fi
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          current=$(awk '/^  url / { sub(/.*\/v/, ""); sub(/\.tar\.gz".*/, ""); print; exit }' Formula/chtf.rb)
          if [ "$version" = "$current" ]; then
            echo "The formula is already at $version"
          else
            echo "Updating the formula from $current to $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the formula
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/tmatilai/chtf/archive/refs/tags/v${VERSION}.tar.gz"
          # The tag exists before the dispatch, and GitHub keeps its tarball stable
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i "s|^  url .*|  url \"$url\"|; s|^  sha256 .*|  sha256 \"$sha\"|" Formula/chtf.rb
          git diff Formula/chtf.rb

      - name: Create Pull Request
        id: create-pr
        if: steps.version.outputs.version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          branch: update-chtf
          commit-message: Update chtf to v${{ steps.version.outputs.version }}
          title: Update chtf to v${{ steps.version.outputs.version }}
          body: |
            [Release notes](https://github.com/tmatilai/chtf/releases/tag/v${{ steps.version.outputs.version }})

            Generated by "${{ github.workflow }}" GitHub Action
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash
