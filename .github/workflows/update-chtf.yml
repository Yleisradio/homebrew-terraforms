name: Update chtf

on:
  # Sent by the release workflow in tmatilai/chtf
  repository_dispatch:
    types: [chtf-release]
  workflow_dispatch:
    inputs:
      version:
        description: "chtf version to update to, defaults to the latest release"
        required: false
  # Fallback for a missed dispatch. Daily at 23:40 UTC
  schedule:
    - cron: '40 23 * * *'

permissions:
  contents: read

concurrency: update-chtf

jobs:
  update_chtf:
    name: Update chtf
    # Only run on the main repo
    if: github.repository == 'tmatilai/homebrew-terraforms'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version to update to
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          # Not interpolated into the script, as they are external input
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$DISPATCH_VERSION}"
          if [ -z "$version" ]; then
            version=$(gh release view --repo tmatilai/chtf --json tagName --jq '.tagName')
          fi
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          current=$(awk '/^  url / { sub(/.*\/v/, ""); sub(/\.tar\.gz".*/, ""); print; exit }' Formula/chtf.rb)
          if [ "$version" = "$current" ]; then
            echo "The formula is already at $version"
          else
            echo "Updating the formula from $current to $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the formula
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/tmatilai/chtf/archive/refs/tags/v${VERSION}.tar.gz"
          # The tag exists before the dispatch, and GitHub keeps its tarball stable
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i "s|^  url .*|  url \"$url\"|; s|^  sha256 .*|  sha256 \"$sha\"|" Formula/chtf.rb
          git diff Formula/chtf.rb

          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Update chtf to v${VERSION}" Formula/chtf.rb

      - name: Create or update the pull request
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: update-chtf
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          title="Update chtf to v${VERSION}"
          body="[Release notes](https://github.com/tmatilai/chtf/releases/tag/v${VERSION})

          Generated by \"${GITHUB_WORKFLOW}\" GitHub Action"

          pr=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            pr=$(gh pr create --head "$BRANCH" --title "$title" --body "$body")
          fi
          gh pr merge "$pr" --auto --squash
