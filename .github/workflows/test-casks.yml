name: Test Changed Terraform Casks
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  # Cask downloads are ~100 MB, so cap how many one job installs.
  MAX_TESTED_CASKS: 3

jobs:
  test_changed_casks:
    name: Test Changed Terraform Casks
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Fetch all history to be able to diff against base branch
          fetch-depth: 0

      - name: Get new and modified Cask files
        id: changed_casks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "Diffing against origin/${BASE_REF}"
          all=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- 'Casks/*.rb')

          total=0
          [ -n "$all" ] && total=$(printf '%s\n' "$all" | wc -l | tr -d ' ')

          # Test the newest versions.
          selected=""
          if [ "$total" -gt 0 ]; then
            selected=$(
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                printf '%s\t%s\n' "$(awk -F'"' '/ version / {print $2; exit}' "$path")" "$path"
              done <<< "$all" | sort -V -k1,1 | tail -n "$MAX_TESTED_CASKS" | cut -f2-
            )
          fi

          tested=0
          [ -n "$selected" ] && tested=$(printf '%s\n' "$selected" | wc -l | tr -d ' ')

          echo "Changed Casks: $total, testing: $tested"
          {
            echo "total=$total"
            echo "tested=$tested"
            echo "skipped=$(( total - tested ))"
            echo "files<<EOF"
            echo "$selected"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: No changed Casks detected
        if: ${{ !steps.changed_casks.outputs.files }}
        run: |
          echo "No cask files in this PR. Skipping tests."

      - name: Warn about untested Casks
        if: ${{ steps.changed_casks.outputs.skipped != '0' }}
        env:
          TOTAL: ${{ steps.changed_casks.outputs.total }}
          TESTED: ${{ steps.changed_casks.outputs.tested }}
          SKIPPED: ${{ steps.changed_casks.outputs.skipped }}
        run: |
          set -euo pipefail
          echo "::warning title=Not all Casks tested::Tested the ${TESTED} newest of ${TOTAL} changed Casks; ${SKIPPED} untested."
          {
            echo "### :warning: Not all Casks tested"
            echo
            echo "Tested the **${TESTED}** newest of **${TOTAL}** changed Casks; **${SKIPPED}** untested."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test changed Casks
        if: ${{ steps.changed_casks.outputs.files }}
        env:
          CHTF_AUTO_INSTALL: "yes"
          FILES: ${{ steps.changed_casks.outputs.files }}
        shell: bash
        run: |
          # Tap the local repository
          brew tap "tmatilai/terraforms" "$(pwd)"
          brew trust tmatilai/terraforms

          # Install chtf
          brew install tmatilai/terraforms/chtf
          source "$(brew --prefix)/share/chtf/chtf.sh"

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            version=$(awk -F'"' '/ version / {print $2; exit}' "$path")
            cask_name=$(basename "$path" .rb)

            echo "Testing v$version ($cask_name)"
            chtf "$version"

            terraform --version | grep "Terraform v$version"

            brew uninstall --cask "$cask_name"
          done <<< "$FILES"
